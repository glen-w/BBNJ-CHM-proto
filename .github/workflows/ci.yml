name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: contracts + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # better-sqlite3 may compile if no prebuild matches the runner.
      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 make g++

      - name: Install
        run: npm ci

      - name: contracts:check
        run: npm run contracts:check

      - name: smoke
        run: npm run smoke

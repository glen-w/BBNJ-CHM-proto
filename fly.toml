# Optional hosted evaluation sandbox (one Machine, one SQLite volume).
# Step-by-step: docs/HOSTED-DEMO.md
#
# Quick path: fly apps create <name>  →  fly secrets set SANDBOX_BASIC_PASSWORD='…'  →  fly deploy
# (Rename `app` below if `bbnj-chm` is taken.) Volume is created on first deploy (initial_size, cdg).

app = "bbnj-chm"
primary_region = "cdg"

[build]

[env]
  DATABASE_PATH = "/app/data/chm.sqlite"
  SANDBOX_RESET = "force"
  READ_ONLY_DEMO = "1"
  SANDBOX_BASIC_USER = "bbnj"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "2m"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "chm_data"
  destination = "/app/data"
  initial_size = "1gb"
  snapshot_retention = 1

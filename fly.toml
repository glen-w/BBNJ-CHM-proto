# Hosted evaluation sandbox (pathway 2). One Machine, one SQLite volume.
# Custom hostname: https://bbnj-chm.glenwright.earth
#
# First deploy: `fly apps create bbnj-chm` then
#   fly secrets set SANDBOX_BASIC_PASSWORD='…'   # required — browser Basic gate
#   fly deploy
# Volume is created on first deploy from initial_size (cdg).
# Share user `bbnj` + that password with webinar/reviewers (not the desk cookies).

app = "bbnj-chm"
primary_region = "cdg"

[build]

[env]
  DATABASE_PATH = "/app/data/chm.sqlite"
  SANDBOX_RESET = "force"
  SANDBOX_BASIC_USER = "bbnj"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "2m"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "chm_data"
  destination = "/app/data"
  initial_size = "1gb"
  snapshot_retention = 1
